[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-bib"
version = "0.1.0"
description = "Arabic bibliographic text: search/display normalisation, book-name composition and audit, author name parts and matching, death years, Hijri dates, edition statements. Zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["arabic", "bibliography", "library", "catalog", "normalization", "hijri", "names", "nlp", "filenames", "metadata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
umalqura = ["hijridate>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "convertdate>=2.4"]

[project.scripts]
arabic-bib = "arabic_bib.cli:main"

[project.entry-points."pocketshelf.profiles"]
warraq = "arabic_bib.integrations:pocketshelf_profile"

[project.urls]
Homepage = "https://warraq.benjelloun.dev/arabic-bib/"
Repository = "https://github.com/kmbenjel/arabic-bib"
Issues = "https://github.com/kmbenjel/arabic-bib/issues"
Changelog = "https://github.com/kmbenjel/arabic-bib/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_bib"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/ar", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = "-q --doctest-modules --import-mode=importlib"

[tool.coverage.run]
source = ["arabic_bib"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "SIM102", "E731", "B023", "B905"]
